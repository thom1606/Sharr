services:
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - ./volumes/radarr/config:/config
      - ./volumes/movies:/movies
      - ./volumes/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - ./volumes/sonarr/config:/config
      - ./volumes/tv:/tv
      - ./volumes/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  sharr:
    build: .
    container_name: sharr
    # Tokens live in .env so they stay out of version control
    env_file:
      - .env
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - 6464:6464
    restart: unless-stopped

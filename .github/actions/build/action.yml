name: 'Build'
description: 'Sets up the repository'

inputs:
    bun-version:
        description: 'The Bun version to install'
        required: false
        default: 'latest'

runs:
    using: 'composite'
    steps:
        - name: Setup bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: ${{ inputs.bun-version }}

        - name: Install dependencies
          # Fail loudly when the lockfile is out of date instead of resolving new versions
          run: bun install --frozen-lockfile
          shell: bash

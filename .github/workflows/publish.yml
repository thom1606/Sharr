name: Publish

on:
  push:
    branches:
      - release/production

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from package.json
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Check if Docker image version exists
        run: |
          if docker manifest inspect ${{ secrets.DOCKER_USERNAME }}/sharr:${{ env.VERSION }} > /dev/null 2>&1; then
            echo "::error::Image version ${{ env.VERSION }} already exists. Bump the version in package.json."
            exit 1
          fi
          echo "Image version ${{ env.VERSION }} does not exist."

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sharr:${{ env.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/sharr:latest

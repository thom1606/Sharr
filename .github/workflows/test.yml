name: Test

on:
    workflow_call:
    pull_request:
        types:
            - opened
            - edited
            - synchronize
            - reopened
    push:
        branches:
            - main

# A newer push makes the in-progress run pointless
concurrency:
    group: test-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout source code
              uses: actions/checkout@v7

            - uses: ./.github/actions/build

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

    tests:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            PLEX_OWNER_TOKEN: ${{ secrets.PLEX_OWNER_TOKEN }}
        steps:
            - name: Checkout source code
              uses: actions/checkout@v7

            - uses: ./.github/actions/build

            - name: Test
              run: bun test

    docker:
        name: Docker build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout source code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Catch a broken Dockerfile before it reaches the release branch
            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
